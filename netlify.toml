# Netlify configuration for the WWWWW x MAN's Habit Tracker
# This file tells Netlify how to build the site and schedule the
# send-reminders function to run at 3 times daily in IST.
#
# Cron format: minute hour day month dayofweek (all in UTC)
# 9 AM IST = 03:30 UTC   -> 'do'      reminder (WWWWW morning habits)
# 7 PM IST = 13:30 UTC   -> 'weights' reminder (30-min weight workout)
# 9 PM IST = 15:30 UTC   -> 'dont'    reminder (MAN's evening DON'Ts)

[build]
  command = "npx next build --webpack"
  publish = "out"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."send-reminders"]
  schedule = "30 3,13,15 * * *"

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = false

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200
  force = false

[[redirects]]
  from = "/api/send-reminders"
  to = "/.netlify/functions/send-reminders"
  status = 200
  force = false
