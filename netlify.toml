# Netlify configuration for the WWWWW x MAN's Habit Tracker
# The site is ALREADY BUILT - the built files are in the repo root.
# Netlify just needs to publish them directly, no build step needed.

[build]
  # No build command needed - the static files are already built
  command = ""
  # Publish the repo root directly (it contains index.html, _next/, etc.)
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled function: send reminders at 9 AM IST, 7 PM IST, and 9 PM IST
[functions."send-reminders"]
  schedule = "30 3,13,15 * * *"

# API routes redirect to Netlify Functions
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = false

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200
  force = false

[[redirects]]
  from = "/api/send-reminders"
  to = "/.netlify/functions/send-reminders"
  status = 200
  force = false
